<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>د وسیلې امنیت ازموینه</title>
  <style>
    body {
      font-family: system-ui, sans-serif;   /* د فونټ تنظیم */
      background: #0f0f0f;                  /* تور شالید */
      color: #eee;                          /* روښانه متن */
      padding: 20px;
      line-height: 1.6;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { color: #4fc3f7; text-align: center; }  /* د سرلیک رنګ */
    .card {
      background: #1a1a1a;                  /* د کارت شالید */
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
      margin: 12px 0;
    }
    .label { color: #888; font-size: 14px; } /* د لیبل رنګ */
    .value { color: #4fc3f7; font-weight: bold; word-break: break-all; } /* ارزښت */
    button {
      background: #4fc3f7;                  /* د تڼۍ رنګ */
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 20px auto;
    }
    button:disabled { background: #555; cursor: not-allowed; } /* غیر فعال */
    #status { text-align: center; color: #ffb74d; }            /* حالت */
  </style>
</head>
<body>
  <h1>د وسیلې امنیت ازموینه</h1>
  <p style="text-align:center;color:#888;">
    دا پاڼه یوازې د خپل وسیله د معلوماتو د راټولولو لپاره ده.
  </p>

  <button id="runBtn">ازموینه پیل کړه</button>
  <div id="status"></div>
  <div id="output"></div>

  <script src="script.js"></script>       <!-- د سکریپټ وصل -->
  <script>
    // د تڼۍ کلیک — ازموینه چلوي
    document.getElementById('runBtn').addEventListener('click', async () => {
      const btn = document.getElementById('runBtn');
      const status = document.getElementById('status');
      const out = document.getElementById('output');

      btn.disabled = true;                 // تڼۍ غیر فعاله
      status.textContent = '⏳ ازموینه روانه ده...';
      out.innerHTML = '';                  // پخوانی پاکول

      try {
        const report = await runSecurityAudit();  // د سکریپټ فنکشن
        status.textContent = '✅ ازموینه بشپړه شوه';

        // د راپور ښودل
        for (const [key, val] of Object.entries(report)) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<div class="label">${key}</div>
                            <div class="value">${JSON.stringify(val)}</div>`;
          out.appendChild(card);
        }
      } catch (err) {
        status.textContent = '❌ خطا: ' + err.message;
        console.error(err);
      } finally {
        btn.disabled = false;              // تڼۍ فعاله
      }
    });
  </script>
</body>
</html>
